# Home Assistant theme "Velair Climate" — Sigma Design System ("figma" token layer) mapped to HA CSS variables.
# Install: copy to /config/themes/velair-climate.yaml (frontend: themes: !include_dir_merge_named themes),
# reload themes, then Settings → Dashboards → climate-ac → theme, or the profile picker. Light and dark modes.
# Source of every value: /Users/izzat/hvac_final/dashboards/sigma_tokens.yaml (transcribed from the design system).
Velair Climate:
  # Type
  primary-font-family: "'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
  paper-font-common-base_-_font-family: "var(--primary-font-family)"
  paper-font-common-code_-_font-family: "'Roboto Mono', ui-monospace, SFMono-Regular, Menlo, monospace"
  paper-font-body1_-_font-family: "var(--primary-font-family)"
  paper-font-subhead_-_font-family: "var(--primary-font-family)"
  paper-font-headline_-_font-family: "var(--primary-font-family)"
  paper-font-caption_-_font-family: "var(--primary-font-family)"
  paper-font-title_-_font-family: "var(--primary-font-family)"
  ha-font-family-body: "var(--primary-font-family)"
  ha-font-family-heading: "var(--primary-font-family)"
  ha-font-family-code: "'Roboto Mono', ui-monospace, SFMono-Regular, Menlo, monospace"
  ha-font-size-body: 14px
  ha-line-height-body: 20px
  ha-font-weight-body: 400
  ha-font-weight-medium: 500
  ha-font-weight-bold: 600
  # Shape and elevation (cards use an inset ring instead of a border, per the kit)
  ha-card-border-radius: 12px
  ha-card-border-width: 0px
  ha-dialog-border-radius: 16px
  ha-border-radius-md: 8px
  ha-border-radius-lg: 12px
  ha-border-radius-xl: 16px
  ha-border-radius-pill: 9999px
  ha-space-1: 4px
  ha-space-2: 8px
  ha-space-3: 12px
  ha-space-4: 16px
  ha-space-6: 24px
  # Motion
  ha-transition-duration-fast: 100ms
  ha-transition-duration-medium: 150ms
  ha-transition-duration-slow: 250ms

  modes:
    light:
      primary-color: "#7F56D9"                 # brand-600, interactive default
      accent-color: "#7F56D9"
      dark-primary-color: "#6941C6"            # brand-700, hover / brand text
      light-primary-color: "#F4EBFF"           # brand-100, focus halo tint
      primary-background-color: "#F9FAFB"      # page: gray-50 (surface-secondary)
      secondary-background-color: "#F2F4F7"    # gray-100
      card-background-color: "#FFFFFF"
      ha-card-background: "#FFFFFF"
      ha-card-box-shadow: "inset 0 0 0 1px #EAECF0, 0px 1px 3px 0px rgba(16,24,40,0.1), 0px 1px 2px 0px rgba(16,24,40,0.06)"
      primary-text-color: "#101828"            # gray-900
      secondary-text-color: "#475467"          # gray-600 (text-tertiary in the kit; HA uses it for captions)
      text-primary-color: "#FFFFFF"
      disabled-text-color: "#98A2B3"           # gray-400
      divider-color: "#E4E7EC"                 # gray-250 hairline
      outline-color: "#D0D5DD"                 # gray-300 border-primary
      outline-hover-color: "#98A2B3"
      state-icon-color: "#667085"              # gray-500
      state-active-color: "#7F56D9"
      state-icon-active-color: "#7F56D9"
      state-inactive-color: "#98A2B3"
      state-unavailable-color: "#D0D5DD"
      state-climate-cool-color: "#1570EF"      # accent-blue-600 (informational)
      state-climate-heat-color: "#EA580C"      # orange-600
      state-climate-dry-color: "#0284C7"       # sky-600
      state-climate-fan-only-color: "#475467"
      state-climate-auto-color: "#16A34A"
      state-climate-heat-cool-color: "#7F56D9"
      state-switch-active-color: "#1570EF"     # toggles in the kit are accent blue
      switch-checked-color: "#1570EF"
      switch-checked-track-color: "#1570EF"
      switch-checked-button-color: "#FFFFFF"
      switch-unchecked-track-color: "#EAECF0"
      switch-unchecked-button-color: "#FFFFFF"
      slider-color: "#7F56D9"
      slider-bar-color: "#EAECF0"
      slider-track-color: "#EAECF0"
      paper-slider-active-color: "#7F56D9"
      paper-slider-knob-color: "#7F56D9"
      paper-slider-container-color: "#EAECF0"
      error-color: "#DC2626"                   # red-600
      warning-color: "#EAB308"                 # yellow-500
      success-color: "#22C55E"                 # green-500
      info-color: "#1570EF"
      error-state-color: "#DC2626"
      warning-state-color: "#EAB308"
      success-state-color: "#22C55E"
      info-state-color: "#1570EF"
      ha-color-fill-primary-normal-resting: "#F9F5FF"
